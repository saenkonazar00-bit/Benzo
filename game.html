<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мультяшный Раннер 🚀</title>
    <style>
        body {
            margin: 0;
            background: #1a0b2e;
            color: white;
            font-family: 'Comic Sans MS', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 420px;
            height: 100vh;
            background: linear-gradient(to bottom, #2b1055, #7597de);
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            z-index: 1;
            animation: floatClouds 12s linear infinite;
        }
        @keyframes floatClouds {
            from { top: -50px; transform: scale(0.5); opacity: 0; }
            5% { opacity: 0.7; }
            95% { opacity: 0.7; }
            to { top: 100%; transform: scale(1.2); opacity: 0; }
        }
        #score-board {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            font-weight: bold;
            z-index: 10;
            background: linear-gradient(135deg, #ff007f, #7928ca);
            padding: 8px 20px;
            border-radius: 50px;
            border: 3px solid #fff;
            white-space: nowrap;
            text-shadow: 2px 2px 0px #000;
        }
        #road {
            position: relative;
            width: 90%;
            margin: 0 auto;
            height: 70%;
            background: rgba(30, 20, 60, 0.8);
            border-left: 6px dashed #ff00cf;
            border-right: 6px dashed #ff00cf;
            box-shadow: 0 0 20px #ff00cf;
        }
        .line {
            position: absolute;
            top: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,242,254,0.1), rgba(0,242,254,0.6));
            box-shadow: 0 0 8px #00f2fe;
        }
        #player {
            position: absolute;
            bottom: 40px;
            width: 65px;
            height: 65px;
            font-size: 55px;
            text-align: center;
            line-height: 65px;
            transition: left 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateX(-50%);
            z-index: 5;
        }
        .element {
            position: absolute;
            width: 55px;
            height: 55px;
            font-size: 45px;
            text-align: center;
            line-height: 55px;
            transform: translateX(-50%);
            z-index: 4;
        }
        #controls {
            position: absolute;
            bottom: 25px;
            width: 100%;
            height: 18%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .ctrl-btn {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: white;
            border: 4px solid #fff;
            font-size: 36px;
            box-shadow: 0 8px 0px #0066b3, 0 10px 20px rgba(0,0,0,0.4);
            outline: none;
        }
        .ctrl-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0px #0066b3, 0 5px 10px rgba(0,0,0,0.4);
        }
        #btn-right {
            background: linear-gradient(135deg, #ff0844, #ffb199);
            box-shadow: 0 8px 0px #b3002d, 0 10px 20px rgba(0,0,0,0.4);
        }
        #btn-right:active {
            box-shadow: 0 4px 0px #b3002d, 0 5px 10px rgba(0,0,0,0.4);
        }
        #game-over {
            display: none;
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #2b1055, #511c74);
            padding: 35px 25px;
            text-align: center;
            border-radius: 25px;
            z-index: 20;
            border: 4px solid #ff007f;
            width: 75%;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
        }
        #game-over button {
            padding: 15px 30px;
            font-size: 22px;
            background: linear-gradient(135deg, #11ffbd, #affcaf);
            color: #111;
            border: 3px solid #fff;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="score-board">
        ✨ <span id="coins">0</span> | 🏆 <span id="high-score">0</span>
    </div>
    
    <div id="road">
        <div class="line" style="left: 16.6%;"></div>
        <div class="line" style="left: 50%;"></div>
        <div class="line" style="left: 83.3%;"></div>
        <div id="player">🚀</div>
    </div>
    
    <div id="game-over">
        <h1 style="color: #ff007f; margin: 0 0 15px 0; font-size: 32px;">БАБАХ! 💥</h1>
        <div style="font-size: 20px; color: #fff;">Вы врезались в бомбу!</div>
        <button onclick="resetGame()">ЕЩЕ РАЗ! 🎮</button>
    </div>
    
    <div id="controls">
        <button class="ctrl-btn" id="btn-left" onclick="movePlayer(-1)">◀</button>
        <button class="ctrl-btn" id="btn-right" onclick="movePlayer(1)">▶</button>
    </div>
</div>

<script>
    let currentLane = 1; 
    const lanes = [16.6, 50, 83.3]; 
    let score = 0;
    let highScore = localStorage.getItem('highScore') || 0;
    let gameInterval;
    let cloudInterval;
    let elements = [];
    let gameActive = true;
    let speed = 7; 

    document.getElementById('high-score').innerText = highScore;

    function updatePlayerPosition() {
        document.getElementById('player').style.left = lanes[currentLane] + '%';
    }
    updatePlayerPosition();

    function movePlayer(direction) {
        if (!gameActive) return;
        currentLane += direction;
        if (currentLane < 0) currentLane = 0;
        if (currentLane > 2) currentLane = 2;
        updatePlayerPosition();
    }

    function spawnCloud() {
        if (!gameActive) return;
        const cloud = document.createElement('div');
        cloud.className = 'cloud';
        cloud.style.left = Math.random() * 80 + '%';
        cloud.style.width = Math.random() * 60 + 40 + 'px';
        cloud.style.height = Math.random() * 30 + 20 + 'px';
        document.getElementById('game-container').insertBefore(cloud, document.getElementById('score-board'));
        setTimeout(() => cloud.remove(), 12000);
    }

    function spawnElement() {
        if (!gameActive) return;
        const lane = Math.floor(Math.random() * 3);
        const isCoin = Math.random() > 0.45; 
        
        const el = document.createElement('div');
        el.className = 'element';
        el.style.left = lanes[lane] + '%';
        el.style.top = '-60px';
        el.innerHTML = isCoin ? '🪙' : '💣';
        el.dataset.type = isCoin ? 'coin' : 'obstacle';
        el.dataset.lane = lane;
        
        document.getElementById('road').appendChild(el);
        elements.push(el);
    }

    function updateGame() {
        let roadHeight = document.getElementById('road').clientHeight;
        
        for (let i = elements.length - 1; i >= 0; i--) {
            let el = elements[i];
            let top = parseInt(el.style.top) || 0;
            top += speed; 
            el.style.top = top + 'px';
            
            if (top > roadHeight - 95 && top < roadHeight - 20) {
                if (parseInt(el.dataset.lane) === currentLane) {
                    if (el.dataset.type === 'coin') {
                        score++;
                        document.getElementById('coins').innerText = score;
                        if (score % 4 === 0) speed += 0.8; 
                        el.remove();
                        elements.splice(i, 1);
                        continue;
                    } else {
                        gameOver();
                    }
                }
            }
            
            if (top > roadHeight) {
                el.remove();
                elements.splice(i, 1);
            }
        }
    }

    function gameOver() {
        gameActive = false;
        clearInterval(gameInterval);
        clearInterval(cloudInterval);
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('highScore', highScore);
            document.getElementById('high-score').innerText = highScore;
        }
        document.getElementById('game-over').style.display = 'block';
    }

    function resetGame() {
        elements.forEach(el => el.remove());
        elements = [];
        score = 0;
        currentLane = 1;
        speed = 7;
        gameActive = true;
        document.getElementById('coins').innerText = score;
        document.getElementById('game-over').style.display = 'none';
        updatePlayerPosition();
        
        clearInterval(gameInterval);
        clearInterval(cloudInterval);
        
        gameInterval = setInterval(() => {
            updateGame();
            if (Math.random() < 0.03) spawnElement(); 
        }, 20);
        
        cloudInterval = setInterval(() => {
            spawnCloud();
        }, 3000);
        
        spawnCloud();
        spawnCloud();
    }

    resetGame();
</script>

</body>
</html>
